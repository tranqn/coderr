# Trust an upstream X-Forwarded-Proto (e.g. from Caddy terminating TLS); fall
# back to this server's own scheme when there is no proxy in front.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow profile-image uploads to pass through the proxy.
    client_max_body_size 10M;

    # API and Django admin -> Gunicorn (same container).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Collected admin static and uploaded media, written by the backend.
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/data/media/;
    }

    # Everything else is the static frontend.
    location / {
        try_files $uri $uri/ =404;
    }
}
